plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreConfig = new Properties()
def keystoreConfigFile = rootProject.file('keystore-config.properties')
if (keystoreConfigFile.exists()) {
    keystoreConfigFile.withReader('UTF-8') { reader ->
        keystoreConfig.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1').toInteger()
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

android {
    namespace "com.example.green"
    compileSdk 35  // ✅ Updated from 34 to 35

    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true  // ✅ Enable Java 8+ features
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.green"
        minSdkVersion 23
        targetSdkVersion 35  // ✅ Updated from 34 to 35
        versionCode flutterVersionCode
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        qa {
            storeFile file('/Users/naveen/Downloads/qa.keystore')

            if (storeFile != null && storeFile.exists()) {
                println "✅ Keystore file exists: ${storeFile.absolutePath}"
            } else {
                println "❌ Keystore file does NOT exist or is not accessible: ${storeFile?.absolutePath}"
            }

            storePassword keystoreConfig.getProperty('QA_KEYSTORE_PASSWORD')
            keyAlias keystoreConfig.getProperty('QA_KEY_ALIAS')
            keyPassword keystoreConfig.getProperty('QA_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.qa
        }
        qa {
            signingConfig signingConfigs.qa
        }
        debug {
            signingConfig signingConfigs.qa
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ✅ Required for Java 8+ support (Fixes flutter_local_notifications issue)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
