plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreConfig = new Properties()
def keystoreConfigFile = rootProject.file('keystore-config.properties')
if (keystoreConfigFile.exists()) {
    keystoreConfigFile.withReader('UTF-8') { reader ->
        keystoreConfig.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '2').toInteger()
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

android {
    namespace "com.risksphere.green"
    compileSdk 35  // ✅ Updated from 34 to 35

    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true  // ✅ Enable Java 8+ features
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.risksphere.green"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 15
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("/Users/naveen/Anshay-qa/my-key.keystore")
            storePassword 'risksphere'
            keyAlias 'alias_name'
            keyPassword 'risksphere'
        }

        qa {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "/Users/naveen/Anshay-qa/my-key.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "risksphere"
            keyAlias System.getenv("KEY_ALIAS") ?: "alias_name"
            keyPassword System.getenv("KEY_PASSWORD") ?: "risksphere"

//            storeFile file("/Users/naveen/Anshay-qa/my-key.keystore")
//            storePassword 'risksphere'
//            keyAlias 'alias_name'
//            keyPassword 'risksphere'
//            storeFile file("/Users/naveen/Documents/qa.keystore")
//            storePassword 'projectgreen123'
//            keyAlias 'qaKey'
//            keyPassword 'projectgreen123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.qa
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
        qa {
            signingConfig signingConfigs.qa
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ✅ Required for Java 8+ support (Fixes flutter_local_notifications issue)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
