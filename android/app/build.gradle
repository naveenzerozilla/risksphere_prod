plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"      // Required for Firebase & Google Sign-In
    id "com.google.firebase.firebase-perf"    // Optional, if using Performance Monitoring
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreConfig = new Properties()
def keystoreConfigFile = rootProject.file('keystore-config.properties')
if (keystoreConfigFile.exists()) {
    keystoreConfigFile.withReader('UTF-8') { reader ->
        keystoreConfig.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '2').toInteger()
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

android {
    namespace "com.zerozilla.risksphere"
    compileSdk 36

    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.zerozilla.risksphere"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("/Users/naveen/Documents/qa.keystore")
            storePassword 'projectgreen123'
            keyAlias 'qaKey'
            keyPassword 'projectgreen123'
        }

        qa {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "/Users/naveen/Documents/qa.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "projectgreen123"
            keyAlias System.getenv("KEY_ALIAS") ?: "qaKey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "projectgreen123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.qa
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        qa {
            signingConfig signingConfigs.qa
            debuggable true
        }
        debug {
            signingConfig signingConfigs.qa
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'com.google.firebase:firebase-perf:20.5.2'

    // Optional: add Google Sign-In explicitly (usually auto-included via Firebase)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
