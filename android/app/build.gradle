plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"      // Required for Firebase & Google Sign-In
    id "com.google.firebase.firebase-perf"    // Optional, if using Performance Monitoring
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreConfig = new Properties()
def keystoreConfigFile = rootProject.file('keystore-config.properties')
if (keystoreConfigFile.exists()) {
    keystoreConfigFile.withReader('UTF-8') { reader ->
        keystoreConfig.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '3').toInteger()
def flutterVersionName = localProperties.getProperty('flutter.versionName', '2.0')

android {
    namespace "com.risksphere.green.qa"
    compileSdk 36
    ndkVersion flutter.ndkVersion
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.risksphere.green.qa"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 52
        versionName "5.5.1"
        multiDexEnabled true
        manifestPlaceholders = [
                appAuthRedirectScheme: "msaleb81a783-765c-482d-8fcb-6440ab1d1201"
        ]
    }

    signingConfigs {
        release {
            // Use the new keystore you created
            storeFile file("/Users/naveen/Documents/new-upload-key.jks")
            storePassword "zerozilla"   // password you entered while generating keystore
            keyAlias "upload"                      // alias you gave (upload)
            keyPassword "zerozilla"     // usually same as storePassword
        }

        qa {
            storeFile file("/Users/naveen/Documents/new-upload-key.jks")
            storePassword "zerozilla"
            keyAlias "upload"
            keyPassword "zerozilla"
        }

        debug {
            storeFile file("/Users/naveen/Documents/new-upload-key.jks")
            storePassword "zerozilla"
            keyAlias "upload"
            keyPassword "zerozilla"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        qa {
            signingConfig signingConfigs.qa
            debuggable true
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'com.google.firebase:firebase-perf:20.5.2'

    // Optional: add Google Sign-In explicitly (usually auto-included via Firebase)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
